spring.application.name=plantpal
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/plantpal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never

# Student 3: keep API keys in environment only; no credential is bundled.
plantpal.gemini.api-key=${GEMINI_API_KEY:}
plantpal.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
plantpal.photos.directory=./data/photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
